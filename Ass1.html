<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .container {
    position: relative;
    width:80%;
    margin: auto;
    height: 400px;
    border: 2px solid black;
    }

    .box {
        width: 120px;
        height: 120px;
        color: white;
        padding: 10px;
    }


    .box1 {
        position: static;
        background: red;
    }
    .box2 {
        position: relative;
        top: 20px;
        left: 40px;
        background: blue;
        z-index: 2;
    }

    .box3 {
        position: absolute;
        bottom: 10px;
        right: 10px;
        background: green;
        z-index: 1;
    }

    
    .box4 {
        position: fixed;
        bottom: 10px;
        right: 10px;
        background: purple;
    }
    </style>
</head>
<body>
    <div class="container">
    <div class="box box1">Static</div>
    <div class="box box2">Relative</div>
    <div class="box box3">Absolute</div>
</div>

<div class="box box4">Fixed</div>
</body>
</html>
