<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            width: 100%;
            height: 100vh;
            background-color: pink;
            display:flex ;
            
        }
        .Container{
             position:relative;
             width:900px;
             height:450px;
             background:#eee;
             border-radius:15px;
             padding:0px;
             box-shadow:0 20px 40px rgba(0,0,0,0.2);
             overflow: visible;
             align-content: center;
             margin:auto;
             
        }
        .text{
           
            width: 55%;
            
            
           
        }
        h2{
            font-size: 3.5rem;
            padding-top: 0;
            padding: 20px;
            margin-left: 40px;
            
            
        }
        .btn{
            width:130px;
            height: 40px;
            font-size: 1rem;
            margin-top: 20px;
            margin-left: 70px;
            border-radius: 5px 0 5px 0;
            background-color: yellow;
        }
        img{
            position:absolute;
            right:80px;
            top: 50px;
            filter: drop-shadow(25px 20px 0px #ff4d4d);
            height:520px;
        }
        
    </style>
</head>
<body>
    <div class="Container">
        <div class="text">
        <h2>Its time to stand out from the crowd</h2>
        <button class="btn">New Collection</button>
        </div>
        <img src="img/model.png" alt="">
    </div>
</body>
</html>
