<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body{
            width:100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            background-color: lightskyblue;
        }
        .container{
            width: 70%;
            padding-top: 120px;
            margin: auto;
            
            height: 80vh;
            align-items: center;
            align-content: center;
            display: grid;
            grid-template-columns: repeat(2,1fr);
            grid-template-rows: 6fr,1fr;
            gap: 20px;
        }
        .item1,.item{
            width: 100%;
            height: 100%;
        }
        .item{
            background-color: rgb(249, 251, 253);
           
            width: 100%;
            height: 300px;
            position: relative;
            transform: skewX(-20deg);
            border-radius: 20px;
            padding: 20px;
            
            box-shadow: 5px spx;
        }
        .hero{
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 20px;
            background-color: #0063A6;
            
            box-shadow: 10px 10px 5px rgb(202, 180, 180);
        }
        .item2,.item-box{
            width: 100%;
            height: 100%;
        }

        .item-box{
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }
        .box{
            width: 150px;
            height: 80px;
            padding-left: 15px;
            border-radius: 20px;
            background-color: #0063A6;
            display: flex;
            padding: 20px;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            color: white;
        }
        .item1{
            display: flex;
            flex-direction: column;
            align-content: center;
            justify-content: center;
            gap: 10px;
        }
        .box h2{
            margin: 0;
            font-size: 2.2rem;
            display: inline-block;
        }
        .box p{
            margin: 0;
            font-size: 1.5rem;
            
            display: inline-block;
        }
        h1{
            font-size: 3rem;
        }
        b{
            font-size: 4rem;
            font-family:blackadder ITC;
        }
        p{
            width: 80%;
            font-size: 1.2rem;
        }
        .buttons{
            width: 100%;
            height: 100%;
            display: flex;
            gap: 10px;
            
        }
        .btn{
            width: 150px;
            padding: 10px;
            
            font-size: 16px;
            border-radius: 999px;
        }
        .blue{
            background-color: #0063A6;
            color: white;
        }
        img{
            height: 500px;
            width: 500px;
            transform: skewX(20deg);
            position: absolute;
            top: -200px;
            right: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">
        <h1><b>Discover</b><br>The World</h1>
        <p>Let's embark on a global journey, immersing ourselves in diverse cultures and creating unforgettable memories as we travel the world</p>
           <div class="buttons">

                <button class="btn blue">Explore More</button>
                <button class="btn"><i class="fa-regular fa-circle-play"></i>Watch Demo</button>
            </div>

        </div>

        <div class="item">
            <div class="hero">
                <img src="./img/hero.png" alt="">

            </div>

        </div> 


        <div class="item2">



        </div>


        <div class="item-box">

            <div class="box"> <h2>64+ <i class="fa-solid fa-arrow-right"></i> </h2><p>countries</p></div>
            <div class="box"> <h2>24M<i class="fa-solid fa-arrow-right"></i></h2> <p>yearly</p></div>
            <div class="box"><h2> 3k+ <i class="fa-solid fa-arrow-right"></i></h2><p>experiences</p></div>

        </div>

    </div>
    
</body>
</html>
