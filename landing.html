<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 15px;
            padding: 0;
        }
        body{
            width: 100%;
            height: 100vh;
            box-sizing: border-box;
            background-image: url(img/back.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            padding: 30px;
            align-content: center;
        }
        .container{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            align-content: center;

        }
        h1{
            font-size: 3.5rem;
            text-align: center;

        }
        p{
            font-size: large;
            text-align: center;
        }
        
        .btn{
            height: 40px;
            border-radius: 10px;
            font-size: large;
            width:120px;
            margin-top: 20px;
            background-color: bisque;
        }
        @media (max-width:700px){
            h2{
                font-size:1rem;
            }
            button{
                font-size:medium;
                height: 30px;
                width:90px;
                background-color: rgb(213, 151, 36);
                color: red;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="content">
        <h1>Welcome to Our website</h1>
        <p>Discover amazing experiences and creating lasting memories</p>
        </div>
        <button class="btn">Get Started</button>
    </div>
</body>
</html>
