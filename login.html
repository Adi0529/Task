<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            width:100%;
            height: 100vh;
            background-color: blueviolet;
            display: flex;
        }
        .login{
            display: flex;
            flex-direction: column;
            width:25%;
            height:50%;
            background-color: rgb(251, 254, 254);
            margin: auto;
            text-align: center;
            align-items: center;
            gap:5px;
            border:2px solid black;
            border-radius: 10px;
            
        }
        .login label{
            padding: 20px;
        }
        h2{
           
           margin-top: 20px;
           font-size: 2rem;
           
        }
        .login input{
            padding: 5px;
            margin-top: 0;
            margin:15px;
            margin-left: 0px;
        }
        .btn{
            width:100px;
            height: 35px;
            border-radius: 10px;
            margin-top: 20px;
            background-color: rgb(198, 18, 198);
        }
        p{
            font-size: 1rem;
            text-align: center;
        }
        a{
            font-size: 1.2rem;
        }
        
    </style>
</head>
<body>
    <div class="login">
        <h2>Login</h2>
        <div class="details">
        <label for="username"><b>Username:</b></label>
        <input type="text" id="username"> <br>
        <label for="pass"><b>Password:</b></label>
        <input type="password"> <br>
        </div>
        <button class="btn">Log in</button>
        <div>
        <p>Sign up using</p>
        <a href="">sign up</a>
        </div>
    </div>
</body>
</html>
